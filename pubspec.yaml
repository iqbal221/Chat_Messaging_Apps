name: ChatVani
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to
version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.8.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.4.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.3.0
  provider: ^6.1.5+1
  country_code_picker: ^3.4.1
  intl_phone_number_field: ^0.2.1
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2
  image_picker: ^1.2.2
  http: ^1.6.0
  intl: ^0.20.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  flutter_local_notifications: ^22.0.0
  flutter_pdfview: ^1.4.4
  path_provider: ^2.1.6
  dio: ^5.9.2
  google_fonts: ^8.1.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
